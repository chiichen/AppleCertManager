[package]
name = "apple-cert-manager"
version = "0.1.0"
edition = "2021"
description = "One-command Apple certificate manager compatible with fastlane match"
readme = "README.md"
rust-version = "1.88"

[[bin]]
name = "acm"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
openssl = "0.10"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3.7"
security-framework-sys = "2"
