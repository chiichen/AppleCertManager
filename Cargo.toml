[workspace]
resolver = "2"
members = [
    "crates/apple-cert-manager-error",
    "crates/apple-cert-manager-types",
    "crates/apple-cert-manager-crypto",
    "crates/apple-cert-manager-devices",
    "crates/apple-cert-manager-config",
    "crates/apple-cert-manager-storage",
    "crates/apple-cert-manager-portal",
    "crates/apple-cert-manager-engine",
    "crates/apple-cert-manager-signing",
    "crates/apple-cert-manager-install",
    "crates/apple-cert-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "One-command Apple certificate manager compatible with fastlane match"
readme = "README.md"

[workspace.dependencies]
apple-cert-manager-error = { path = "crates/apple-cert-manager-error" }
apple-cert-manager-types = { path = "crates/apple-cert-manager-types" }
apple-cert-manager-crypto = { path = "crates/apple-cert-manager-crypto" }
apple-cert-manager-devices = { path = "crates/apple-cert-manager-devices" }
apple-cert-manager-config = { path = "crates/apple-cert-manager-config" }
apple-cert-manager-storage = { path = "crates/apple-cert-manager-storage" }
apple-cert-manager-portal = { path = "crates/apple-cert-manager-portal" }
apple-cert-manager-engine = { path = "crates/apple-cert-manager-engine" }
apple-cert-manager-signing = { path = "crates/apple-cert-manager-signing" }
apple-cert-manager-install = { path = "crates/apple-cert-manager-install" }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
openssl = "0.10"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
security-framework = "3.7"
security-framework-sys = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
toml = "0.8"
